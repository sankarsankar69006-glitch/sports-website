
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore AFC Asian Cup tournament coverage, qualified national teams, tournament history, and top Asian football moments on PlayZone.">
    <title>AFC Asian Cup | PlayZone</title>
    <link rel="icon" href="./assets/icon.png">
    <link rel="stylesheet" href="./afc-asian-cup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <main class="afc-page">

        <header class="afc-hero">
            <div class="hero-topline">
                <span class="hero-label">ASIAN INTERNATIONAL FOOTBALL</span>
                <span class="hero-edition">QATAR 2023-2024</span>
            </div>

            <h1>AFC <span>Asian Cup</span></h1>

            <p>
                Explore Asia's national football teams, their groups
                and their journey in the continental championship.
            </p>

            <a href="./index.html" class="back-home">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Home
            </a>

            <div class="hero-decoration">ASIA</div>
        </header>

        <section class="teams-section">
            <div class="section-heading">
                <div>
                    <span class="section-kicker">THE CONTENDERS</span>
                    <h2>National <span>Teams</span></h2>
                </div>

                <p><span id="teamCount">24</span> Teams <i class="fa-solid fa-globe-asia"></i></p>
            </div>

            <div class="group-filter" id="groupFilter">
                <button class="filter-btn active" data-group="ALL">All Teams</button>
                <button class="filter-btn" data-group="A">Group A</button>
                <button class="filter-btn" data-group="B">Group B</button>
                <button class="filter-btn" data-group="C">Group C</button>
                <button class="filter-btn" data-group="D">Group D</button>
                <button class="filter-btn" data-group="E">Group E</button>
                <button class="filter-btn" data-group="F">Group F</button>
            </div>

            <div class="afc-team-grid" id="afcTeamGrid"></div>
        </section>

        <footer class="afc-footer">
            <span class="footer-mark">PLAY<span>ZONE</span></span>
            <p>Every nation. One dream. One continent.</p>
        </footer>

    </main>

    <script src="./afc-asian-cup.js"></script>
</body>
</html>
